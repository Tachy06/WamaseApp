<!DOCTYPE html>
{% load static %}
{% load pwa %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}La web oficial de la mecánica Wesaca{% endblock %}">
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="shortcut icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <title>Register WamaseApp</title>
    {% progressive_web_app_meta %}
</head>
<body>
    <style>
        /* Estilo para ocultar los botones de incremento y decremento en Chrome, Safari y Edge */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    
        /* Estilo para ocultar los botones de incremento y decremento en Firefox */
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
    <main class="register">
        {% if messages %}
            {% for message in messages %}
                <div class="alert {{ message.tags }} alert-dismissible fade show alert-pc" role="alert" style="margin-bottom: 0px;">
                    <p style="font-size: 17px; font-weight: bold;">{{ message }}</p>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    <div class="container">
            <div class="card my-3" style="box-shadow: 0px 0px 5px black;">
                <div class="card-body">
                    <div class="loguito text-center mb-4">
                        <img src="{% static 'images/register.jpg' %}" alt="register-img" class="img-loguito">
                    </div>
                    <form action="" method="POST">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="license_plate" class="form-label">Número de Placa</label>
                                <input type="text" id="license_plate" name="license_plate" class="form-control text-center" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="vin" class="form-label">Número de VIN</label>
                                <input type="text" name="vin" id="vin" class="form-control text-center">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="brand" class="form-label">Marca</label>
                                <input type="text" id="brand" name="brand" class="form-control text-center" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="year" class="form-label">Año</label>
                                <input type="number" id="year" name="year" class="form-control text-center" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="oil" class="form-label">Aceite a usar</label>
                                <select name="oil" id="oil" class="form-control text-center" required>
                                    <option value="" disabled selected>Seleccione el tipo de aceite</option>
                                    <option value="1">Havoline</option>
                                    <option value="2">Chevron</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="property" class="form-label">Propietario</label>
                                <input type="text" name="property" id="property" class="form-control text-center" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="code_filter_oil" class="form-label">Codigo filtro de aceite</label>
                                <input type="text" id="code_filter_oil" name="code_filter_oil" class="form-control text-center">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="code_filter_air" class="form-label">Código filtro de aire</label>
                                <input type="text" id="code_filter_air" name="code_filter_air" class="form-control text-center">
                            </div>
                        </div>
                        <div class="row mb-1">
                            <div class="col-md-6 mb-3">
                                <label for="correo" class="form-label">Correo a asociar</label>
                                <input type="email" name="email" id="email" class="form-control text-center">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="code" class="form-label">Código de Seguridad</label>
                                <input type="number" name="code" id="code" class="form-control text-center">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12 d-flex justify-content-center width 100px">
                                <button type="submit" class="btn btn-primary">Registrar</button>
                            </div>
                        </div>
                    </form>
                    <p class="mt-3 text-center">Si ya tienes una cuenta, inicia sesión <a href="{% url 'Login' %}">aquí</a></p>
                </div>
            </div>
        </div>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

</html>
