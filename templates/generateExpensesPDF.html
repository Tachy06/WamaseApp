<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expenses PDF</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            font-size: 12px;
        }
        .container {
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gastos reportados de {{ user.username }}</h1>
        <table>
            <thead>
                <tr>
                    <th>Motivo</th>
                    <th>Costo</th>
                    <th>Fecha </th>
                </tr>
            </thead>
            <tbody>
                {% for expense in expenses %}
                    <tr>
                        <td>{{ expense.title }}</td>
                        <td>₡{{ expense.amount }}</td>
                        <td>{{ expense.date }}</td>
                    </tr>
                {% endfor %}
                <tr>
                    <td>Total</td>
                    <td>₡{{ total }}</td>
                    <td></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
