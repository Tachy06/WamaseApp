<!DOCTYPE html>
{% load static %}
{% load pwa %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin</title>    
    {% progressive_web_app_meta %}
    <meta name="description" content="{% block meta_description %}Panel Administrador de Wamase{% endblock %}">
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="shortcut icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    {% if request.user.is_superuser %}
        <section class="pageForm2">
            <section class="back ms-3">
                <div class="contenedor">
                    <a href="/admin/">
                        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-arrow-return-left" viewBox="0 0 16 16" style="margin-top: 15px; margin-left: 10px; color: white;">
                            <path fill-rule="evenodd" d="M14.5 1.5a.5.5 0 0 1 .5.5v4.8a2.5 2.5 0 0 1-2.5 2.5H2.707l3.347 3.346a.5.5 0 0 1-.708.708l-4.2-4.2a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L2.707 8.3H12.5A1.5 1.5 0 0 0 14 6.8V2a.5.5 0 0 1 .5-.5"/>
                        </svg>
                    </a>
                </div>
            </section>
            {% if messages %}
                {% for message in messages %}
                    <div class="alert {{ message.tags }} alert-dismissible fade show" role="alert" style="margin-bottom: 0px;">
                        <p style="font-size: 17px; font-weight: bold;">{{ message }}</p>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
            <div class="container mt-3">
                <div class="card my-5" style="box-shadow: 0px 0px 5px black; max-width: 40rem; margin: auto;">
                    <div class="card-body">
                        <h3 class="mb-4 text-center" style="font-size: 22px;">Agregar cambio de aceite</h3>
                        <form action="" method="post">
                            {% csrf_token %}
                            <div class="mb-3 text-center">
                                <label for="date" class="form-label">Fecha del cambio</label>
                                <input type="date" name="date" id="date" value="{{ fecha|date:'Y-m-d' }}" class="form-control d-inline-block mx-auto" style="width: 200px;">
                            </div>
                            <div class="mb-3">
                                <label for="car" class="form-label">Vehiculo a escoger</label>
                                <select name="car" id="car" class="form-control" required>
                                    {% for car in cars %}
                                        <option value="{{ car.id }}">{{ car.username }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Filtro de aire</label>
                                    <div class="d-flex justify-content-center">
                                        <div class="form-check form-check-inline">
                                            <input type="radio" name="air-filter" id="air-filter-Si" value="Si" class="form-check-input" checked>
                                            <label class="form-check-label" for="air-filter-Si">Sí</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input type="radio" name="air-filter" id="air-filter-No" value="No" class="form-check-input">
                                            <label class="form-check-label" for="air-filter-No">No</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Filtro de aceite</label>
                                    <div class="d-flex justify-content-center">
                                        <div class="form-check form-check-inline">
                                            <input type="radio" name="oil-filter" id="oil-filter-Si" value="Si" class="form-check-input" checked>
                                            <label class="form-check-label" for="oil-filter-Si">Sí</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input type="radio" name="oil-filter" id="oil-filter-No" value="No" class="form-check-input">
                                            <label class="form-check-label" for="oil-filter-No">No</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Filtro de combustible</label>
                                    <div class="d-flex justify-content-center">
                                        <div class="form-check form-check-inline">
                                            <input type="radio" name="fuel-filter" id="fuel-filter-Si" value="Si" class="form-check-input" checked>
                                            <label class="form-check-label" for="fuel-filter-Si">Sí</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input type="radio" name="fuel-filter" id="fuel-filter-No" value="No" class="form-check-input">
                                            <label class="form-check-label" for="fuel-filter-No">No</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Trampa de agua</label>
                                    <div class="d-flex justify-content-center">
                                        <div class="form-check form-check-inline">
                                            <input type="radio" name="water-trap" id="water-trap-Si" value="Si" class="form-check-input" checked>
                                            <label class="form-check-label" for="water-trap-Si">Sí</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input type="radio" name="water-trap" id="water-trap-No" value="No" class="form-check-input">
                                            <label class="form-check-label" for="water-trap-No">No</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-outline-primary btn-block mx-auto" style="max-width: 200px;">Agregar cambio</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    {% endif %}
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script> 
</body>
</html>
