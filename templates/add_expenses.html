{% extends 'base.html' %}
{% load static %}
{% load pwa %}
{% block title %} <title>Añadir Gastos</title> {% endblock %}
{% block content %}
<section class="expenses">
    <div class="container">
        {% for message in messages %}
            <div class="alert {{ message.tags }} alert-dismissible fade show" role="alert" style="margin-bottom: 0px;">
                <p style="font-size: 17px; font-weight: bold;">{{ message }}</p>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
        <div class="card">
            <div class="card-body">
                <h1 style="margin-bottom: 15px;" class="h1-expenses">Reportar gastos </h1>
                <form action="" method="post">
                    {% csrf_token %}
                    {% if request.user.is_superuser %}
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="car" class="form-label">Vehículo a escoger</label>
                                <select name="car" id="car" class="form-control text-center" required>
                                    <option value="0" disabled selected>Seleccionar vehículo</option>
                                    {% for car in cars %}
                                        {% if car.is_superuser %}
                                        {% else %}
                                            <option value="{{ car.id }}">{{ car.username }}</option>
                                        {% endif %}
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="expense" class="form-label">Motivo del gasto</label>
                                <input type="text" id="expense" name="expense" class="form-control" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="amount" class="form-label">Costo total</label>
                                <input type="number" id="amount" name="amount" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="description" class="form-label"> Indicaciones adicionales</label>
                                <input type="text" id="description" name="description" class="form-control" required>
                            </div>
                        </div>
                    {% else %}
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="expense" class="form-label">Motivo del gasto</label>
                                <input type="text" id="expense" name="expense" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="amount" class="form-label">Costo total</label>
                                <input type="number" id="amount" name="amount" class="form-control" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="mb-3">
                                <label for="description" class="form-label"> Indicaciones adicionales</label>
                                <input type="text" id="description" name="description" class="form-control" required>
                            </div>
                        </div>
                    {% endif %}
                    <button type="submit" class="btn btn-primary">Añadir gasto</button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
